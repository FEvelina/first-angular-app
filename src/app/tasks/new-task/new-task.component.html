<div (click)="onCloseAddNewTask()" class="backdrop"></div>
<dialog open>
  <h2>Add a new task to your goal!</h2>
  <form (ngSubmit)="onSubmit()">
    <p class="form-input">
      <label for="title">Title: </label>
      <input
        type="text"
        name="title"
        id="title"
        required
        [(ngModel)]="enteredTitle"
      />
    </p>
    <p class="form-input">
      <label for="summary"> Summary: </label>
      <textarea
        row="5"
        name="summary"
        id="summary"
        required
        [(ngModel)]="enteredSummary"
      ></textarea>
    </p>
    <p class="form-input">
      <label for="due-date">Due Date: </label>
      <input
        type="date"
        name="due-date"
        id="due-date"
        required
        [(ngModel)]="enteredDate"
      />
    </p>
    <p class="actions">
      <button type="button" (click)="onCloseAddNewTask()">Cancel</button>
      <button type="submit">Create</button>
    </p>
  </form>
</dialog>
